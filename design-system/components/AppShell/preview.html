<!-- @dsCard group="Layout" height=520 subtitle="Top bar, layer panel, 3D viewport well and placement readout" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AppShell</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  body { margin: 0; padding: var(--space-4); background: var(--surface-100); color: var(--ink); overflow-x: auto; }

  .frame {
    width: 900px; height: 460px; box-sizing: border-box; display: grid; grid-template-rows: 56px 1fr;
    background: var(--surface-100); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden;
  }

  /* Top bar */
  .topbar {
    display: flex; align-items: center; gap: var(--space-6); padding: 0 var(--space-4);
    background: var(--surface-200); border-bottom: 1px solid var(--border);
  }
  .app-name { margin: 0; font-family: var(--font-display); font-size: 20px; line-height: 24px; font-weight: 600; letter-spacing: -0.01em; }
  .tabs { display: flex; align-self: stretch; gap: var(--space-1); }
  .tab {
    position: relative; display: inline-flex; align-items: center; min-height: 32px; align-self: center; padding: 0 var(--space-3);
    background: transparent; color: var(--ink-muted); border: 0; border-radius: var(--radius-md); cursor: pointer;
    font-family: var(--font-sans); font-size: 14px; line-height: 20px; font-weight: 600;
  }
  .tab:hover { color: var(--ink); background: var(--surface-sunken); }
  .tab[aria-selected="true"] { color: var(--ink); }
  .tab[aria-selected="true"]::after {
    content: ""; position: absolute; left: var(--space-3); right: var(--space-3); bottom: -10px; height: 3px;
    background: var(--accent); border-radius: var(--radius-pill);
  }
  .tab:focus-visible, .btn:focus-visible, .layer:focus-visible, .switch:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  .spacer { flex: 1; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: var(--space-1); box-sizing: border-box;
    min-height: 36px; padding: 0 var(--space-4); cursor: pointer; white-space: nowrap;
    border: 1px solid transparent; border-radius: var(--radius-md);
    font-family: var(--font-sans); font-size: 14px; line-height: 20px; font-weight: 600;
  }
  .btn.primary { background: var(--accent); color: var(--on-accent); box-shadow: var(--shadow-sm); }
  .btn.primary:hover { background: var(--accent-strong); }
  .btn.icon { width: 36px; padding: 0; background: transparent; color: var(--ink); border-color: var(--border-strong); }
  .btn.icon:hover { background: var(--surface-sunken); }
  .theme-icon .moon { display: none; }
  :root[data-theme="dark"] .theme-icon .sun { display: none; }
  :root[data-theme="dark"] .theme-icon .moon { display: block; }

  /* Body grid */
  .main { display: grid; grid-template-columns: 240px 1fr 180px; gap: var(--space-4); padding: var(--space-4); min-height: 0; }
  .panel {
    box-sizing: border-box; min-width: 0; min-height: 0; overflow: auto; padding: var(--space-4);
    background: var(--surface-200); border: 1px solid var(--border); border-radius: var(--radius-lg);
  }
  .panel h2 { margin: 0 0 var(--space-2); }

  /* Layers */
  .layers { list-style: none; margin: 0 0 var(--space-6); padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .layer {
    display: flex; align-items: center; gap: var(--space-2); width: 100%; box-sizing: border-box; min-height: 32px; padding: 0 var(--space-2);
    background: transparent; color: var(--ink); border: 1px solid transparent; border-radius: var(--radius-md); cursor: pointer; text-align: left;
    font-family: var(--font-sans); font-size: 14px; line-height: 20px;
  }
  .layer:hover { background: var(--surface-sunken); }
  .layer[aria-current="true"] { background: var(--accent-soft); border-color: var(--accent); font-weight: 600; }
  .swatch { flex: none; width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--border-strong); }
  .swatch.cu { background: var(--scene-copper); }
  .swatch.outline { background: var(--surface-300); }
  .swatch.drill { background: var(--scene-board); }
  .layer .file { margin-left: auto; color: var(--ink-muted); font-family: var(--font-mono); font-size: 11.5px; font-weight: 400; }

  /* Form */
  .field { display: flex; flex-direction: column; gap: var(--space-1); margin-bottom: var(--space-3); }
  .field .label { color: var(--ink-muted); text-transform: uppercase; }
  .input {
    display: flex; align-items: center; box-sizing: border-box; min-height: 36px;
    background: var(--surface-300); border: 1px solid var(--border-strong); border-radius: var(--radius-md);
  }
  .input:has(input:focus-visible) { outline: 2px solid var(--ring); outline-offset: 2px; }
  .input input {
    flex: 1; min-width: 0; height: 34px; box-sizing: border-box; padding: 0 var(--space-3); background: transparent; color: var(--ink);
    border: 0; outline: 0; text-align: right; font-family: var(--font-mono); font-size: 14px;
  }
  .unit { padding-right: var(--space-3); color: var(--ink-muted); font-family: var(--font-mono); font-size: 12.5px; }
  .switch-row { display: flex; align-items: center; gap: var(--space-2); min-height: 32px; }
  .switch { flex: none; position: relative; width: 44px; height: 26px; padding: 0; cursor: pointer; background: var(--surface-sunken); border: 1px solid var(--border-strong); border-radius: var(--radius-pill); }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: var(--radius-pill); background: var(--border-strong); }
  .switch[aria-checked="true"] { background: var(--accent); border-color: var(--accent); }
  .switch[aria-checked="true"]::after { left: 21px; background: var(--on-accent); }

  /* Viewport */
  .viewport {
    display: grid; place-items: center; box-sizing: border-box; min-width: 0;
    background: var(--surface-sunken); border: 1px solid var(--border); border-radius: var(--radius-lg);
  }
  .placeholder {
    display: flex; flex-direction: column; align-items: center; gap: var(--space-1); padding: var(--space-6) var(--space-8);
    border: 1px dashed var(--border-strong); border-radius: var(--radius-md); color: var(--ink-muted); text-align: center;
  }
  .placeholder .heading { color: var(--ink); }
  .placeholder .code { color: var(--ink-muted); }

  /* Placement readout */
  .readouts { margin: 0; display: flex; flex-direction: column; gap: var(--space-3); }
  .readouts dt { color: var(--ink-muted); text-transform: uppercase; }
  .readouts dd { margin: 0; }
  .readouts .side { font-family: var(--font-sans); font-size: 18px; line-height: 30px; font-weight: 600; }
  .note { margin: var(--space-4) 0 0; color: var(--ink-muted); }
</style>
</head>
<body class="body">

<div class="frame">
  <header class="topbar">
    <p class="app-name">Copperline</p>
    <div class="tabs" role="tablist" aria-label="Workspace">
      <button class="tab" type="button" role="tab" aria-selected="true" id="tab-design">Design</button>
      <button class="tab" type="button" role="tab" aria-selected="false" id="tab-sim" tabindex="-1">Simulate</button>
      <button class="tab" type="button" role="tab" aria-selected="false" id="tab-machine" tabindex="-1">Machine</button>
    </div>
    <div class="spacer"></div>
    <button class="btn icon theme-icon" type="button" id="theme-toggle" aria-label="Switch to dark theme">
      <svg class="sun" width="20" height="20" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false"><path d="M120,40V16a8,8,0,0,1,16,0V40a8,8,0,0,1-16,0Zm72,88a64,64,0,1,1-64-64A64.07,64.07,0,0,1,192,128Zm-16,0a48,48,0,1,0-48,48A48.05,48.05,0,0,0,176,128ZM58.34,69.66A8,8,0,0,0,69.66,58.34l-16-16A8,8,0,0,0,42.34,53.66Zm0,116.68-16,16a8,8,0,0,0,11.32,11.32l16-16a8,8,0,0,0-11.32-11.32ZM192,72a8,8,0,0,0,5.66-2.34l16-16a8,8,0,0,0-11.32-11.32l-16,16A8,8,0,0,0,192,72Zm5.66,114.34a8,8,0,0,0-11.32,11.32l16,16a8,8,0,0,0,11.32-11.32ZM48,128a8,8,0,0,0-8-8H16a8,8,0,0,0,0,16H40A8,8,0,0,0,48,128Zm80,80a8,8,0,0,0-8,8v24a8,8,0,0,0,16,0V216A8,8,0,0,0,128,208Zm112-88H216a8,8,0,0,0,0,16h24a8,8,0,0,0,0-16Z"/></svg>
      <svg class="moon" width="20" height="20" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false"><path d="M233.54,142.23a8,8,0,0,0-8-2,88.08,88.08,0,0,1-109.8-109.8,8,8,0,0,0-10-10,104.84,104.84,0,0,0-52.91,37A104,104,0,0,0,136,224a103.09,103.09,0,0,0,62.52-20.88,104.84,104.84,0,0,0,37-52.91A8,8,0,0,0,233.54,142.23ZM188.9,190.34A88,88,0,0,1,65.66,67.11a89,89,0,0,1,31.4-26A106,106,0,0,0,96,56,104.11,104.11,0,0,0,200,160a106,106,0,0,0,14.92-1.06A89,89,0,0,1,188.9,190.34Z"/></svg>
    </button>
    <button class="btn primary" type="button">
      <svg width="20" height="20" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false"><path d="M224,144v64a8,8,0,0,1-8,8H40a8,8,0,0,1-8-8V144a8,8,0,0,1,16,0v56H208V144a8,8,0,0,1,16,0Zm-101.66,5.66a8,8,0,0,0,11.32,0l40-40a8,8,0,0,0-11.32-11.32L136,124.69V32a8,8,0,0,0-16,0v92.69L93.66,98.34a8,8,0,0,0-11.32,11.32Z"/></svg>
      Export G-code
    </button>
  </header>

  <div class="main">
    <aside class="panel" aria-label="Layers and placement settings">
      <h2 class="heading" id="layers-h">Layers</h2>
      <ul class="layers" aria-labelledby="layers-h">
        <li><button class="layer" type="button" aria-current="true"><span class="swatch cu" aria-hidden="true"></span>Top copper<span class="file">F_Cu</span></button></li>
        <li><button class="layer" type="button"><span class="swatch cu" aria-hidden="true"></span>Bottom copper<span class="file">B_Cu</span></button></li>
        <li><button class="layer" type="button"><span class="swatch outline" aria-hidden="true"></span>Outline<span class="file">Edge_Cuts</span></button></li>
        <li><button class="layer" type="button"><span class="swatch drill" aria-hidden="true"></span>Drill<span class="file">.drl</span></button></li>
      </ul>
      <div class="field">
        <label class="label" for="s-ox">Offset X</label>
        <div class="input"><input id="s-ox" type="text" inputmode="decimal" value="12.50"><span class="unit" aria-hidden="true">mm</span></div>
      </div>
      <div class="switch-row">
        <button class="switch" type="button" role="switch" aria-checked="false" aria-labelledby="s-mirror" id="s-switch"></button>
        <span class="body" id="s-mirror">Mirror for bottom side</span>
      </div>
    </aside>

    <main class="viewport" aria-label="3D viewport">
      <div class="placeholder">
        <span class="heading">3D viewport</span>
        <span class="code">board_v3-F_Cu.gbr · Top side</span>
      </div>
    </main>

    <aside class="panel" aria-label="Placement readout">
      <h2 class="heading">Placement</h2>
      <dl class="readouts">
        <div><dt class="label">X</dt><dd class="readout">042.50</dd></div>
        <div><dt class="label">Y</dt><dd class="readout">018.00</dd></div>
        <div><dt class="label">Side</dt><dd class="side">Top</dd></div>
      </dl>
      <p class="small note">Offset is applied to every G-code move.</p>
    </aside>
  </div>
</div>

<script>
  // Theme toggle: flips document.documentElement.dataset.theme between light and dark.
  var toggle = document.getElementById('theme-toggle');
  function syncLabel() {
    var dark = document.documentElement.dataset.theme === 'dark';
    toggle.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
  }
  toggle.addEventListener('click', function () {
    var dark = document.documentElement.dataset.theme === 'dark';
    document.documentElement.dataset.theme = dark ? 'light' : 'dark';
    syncLabel();
  });
  syncLabel();

  // Tabs
  var tabs = Array.prototype.slice.call(document.querySelectorAll('[role="tab"]'));
  function activate(i) {
    tabs.forEach(function (t, j) { t.setAttribute('aria-selected', String(i === j)); t.tabIndex = i === j ? 0 : -1; });
    tabs[i].focus();
  }
  tabs.forEach(function (t, i) {
    t.addEventListener('click', function () { activate(i); });
    t.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight') { e.preventDefault(); activate((i + 1) % tabs.length); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); activate((i - 1 + tabs.length) % tabs.length); }
    });
  });

  // Layer selection
  var layers = Array.prototype.slice.call(document.querySelectorAll('.layer'));
  layers.forEach(function (l) {
    l.addEventListener('click', function () {
      layers.forEach(function (o) { o.removeAttribute('aria-current'); });
      l.setAttribute('aria-current', 'true');
    });
  });

  // Mirror switch
  var sw = document.getElementById('s-switch');
  sw.addEventListener('click', function () {
    sw.setAttribute('aria-checked', String(sw.getAttribute('aria-checked') !== 'true'));
  });
</script>
</body>
</html>
