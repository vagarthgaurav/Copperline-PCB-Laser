<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>StatusChip</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  body { margin: 0; padding: var(--space-4); background: var(--surface-100); color: var(--ink); }
  .group { margin-bottom: var(--space-6); }
  .group h2 { margin: 0 0 var(--space-2); color: var(--ink-muted); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); }
  .stack { display: flex; flex-direction: column; gap: var(--space-2); }

  .chip {
    display: inline-flex; align-items: center; gap: var(--space-1); box-sizing: border-box;
    min-height: 28px; padding: 0 var(--space-3) 0 var(--space-2);
    border-radius: var(--radius-pill); font-family: var(--font-sans); font-size: 12.5px; line-height: 18px; font-weight: 600;
    white-space: nowrap;
  }
  .chip svg { flex: none; }
  .chip .detail { font-family: var(--font-mono); font-weight: 400; }
  .chip.connected { background: var(--mask-soft); color: var(--mask); }
  .chip.disconnected { background: var(--surface-sunken); color: var(--ink-muted); }
  .chip.engraving { background: var(--accent-soft); color: var(--accent-strong); }
  .chip.paused { background: var(--warning-soft); color: var(--warning); }
  .chip.fault { background: var(--danger-soft); color: var(--danger); }

  .banner {
    display: flex; align-items: flex-start; gap: var(--space-3); box-sizing: border-box;
    padding: var(--space-3) var(--space-4); border-radius: var(--radius-lg); max-width: 640px;
    border: 1px solid currentColor;
  }
  .banner > svg { flex: none; margin-top: 0; }
  .banner .text { flex: 1; min-width: 0; margin: 0; }
  .banner .title { display: block; }
  .banner .msg { display: block; color: var(--ink); }
  .banner.warn { background: var(--warning-soft); color: var(--warning); }
  .banner.err { background: var(--danger-soft); color: var(--danger); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: var(--space-1); box-sizing: border-box;
    min-height: 32px; padding: 0 var(--space-3); cursor: pointer; flex: none;
    background: var(--surface-300); color: var(--ink); border: 1px solid var(--border-strong); border-radius: var(--radius-md);
    font-family: var(--font-sans); font-size: 14px; line-height: 20px; font-weight: 600;
  }
  .btn:hover { background: var(--surface-sunken); }
  .btn.icon { width: 32px; padding: 0; background: transparent; border-color: transparent; color: var(--ink); }
  .btn.icon:hover { background: var(--surface-sunken); }
  .btn:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
</style>
</head>
<body class="body">
