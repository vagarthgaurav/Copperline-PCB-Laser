<!-- @dsCard group="Actions" height=500 subtitle="Primary, secondary, ghost and danger buttons in two sizes" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Button</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  body { margin: 0; padding: var(--space-4); background: var(--surface-100); color: var(--ink); }
  .group { margin-bottom: var(--space-6); }
  .group h2 { margin: 0 0 var(--space-2); color: var(--ink-muted); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); }
  .cap { color: var(--ink-muted); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: var(--space-1);
    box-sizing: border-box; min-height: 36px; padding: 0 var(--space-4);
    border: 1px solid transparent; border-radius: var(--radius-md);
    font-family: var(--font-sans); font-size: 14px; line-height: 20px; font-weight: 600;
    cursor: pointer; white-space: nowrap;
  }
  .btn svg { flex: none; }
  .btn:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  .btn.sm { min-height: 32px; padding: 0 var(--space-3); }

  .btn.primary { background: var(--accent); color: var(--on-accent); box-shadow: var(--shadow-sm); }
  .btn.primary:hover, .btn.primary.is-hover { background: var(--accent-strong); }

  .btn.secondary { background: var(--surface-300); color: var(--ink); border-color: var(--border-strong); box-shadow: var(--shadow-sm); }
  .btn.secondary:hover, .btn.secondary.is-hover { background: var(--surface-sunken); }

  .btn.ghost { background: transparent; color: var(--accent-strong); }
  .btn.ghost:hover, .btn.ghost.is-hover { background: var(--accent-soft); }

  .btn.danger { background: var(--danger-soft); color: var(--danger); border-color: var(--danger); }
  .btn.danger:hover, .btn.danger.is-hover { background: var(--surface-300); }

  .btn.icon { padding: 0; width: 36px; }
  .btn.icon.sm { width: 32px; }
  .btn.icon.ghost { color: var(--ink); }
  .btn.icon.ghost:hover, .btn.icon.ghost.is-hover { background: var(--surface-sunken); }

  .btn:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }
  .btn.primary:disabled { background: var(--surface-sunken); color: var(--ink-muted); border-color: var(--border-strong); opacity: 1; }
  .btn.primary:disabled svg { opacity: 0.8; }
</style>
</head>
<body class="body">

<section class="group" aria-labelledby="g-variants">
  <h2 id="g-variants" class="label">Variants (default / hover / focus)</h2>
  <div class="row">
    <button class="btn primary" type="button">Export G-code</button>
    <button class="btn primary is-hover" type="button">Export G-code</button>
    <button class="btn secondary" type="button">Flip to bottom</button>
    <button class="btn secondary is-hover" type="button">Flip to bottom</button>
    <button class="btn ghost" type="button">Open Gerber…</button>
    <button class="btn ghost is-hover" type="button">Open Gerber…</button>
  </div>
  <div class="row" style="margin-top: var(--space-2)">
    <button class="btn danger" type="button">Emergency stop</button>
    <button class="btn danger is-hover" type="button">Emergency stop</button>
    <button class="btn secondary" type="button" id="focus-demo">Tab to me for the focus ring</button>
  </div>
</section>

<section class="group" aria-labelledby="g-sizes">
  <h2 id="g-sizes" class="label">Sizes</h2>
  <div class="row">
    <button class="btn primary" type="button">Connect</button>
    <span class="small cap">md, 36px</span>
    <button class="btn primary sm" type="button">Connect</button>
    <span class="small cap">sm, 32px</span>
    <button class="btn secondary" type="button">Flip to bottom</button>
    <button class="btn secondary sm" type="button">Flip to bottom</button>
  </div>
</section>

      Emergency stop
    </button>
  </div>
</section>

</section>

</body>
</html>
