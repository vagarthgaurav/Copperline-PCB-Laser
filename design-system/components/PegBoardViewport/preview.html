<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PegBoardViewport</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  body { margin:0; padding:var(--space-4); background:var(--surface-100); color:var(--ink); font-family:var(--font-sans); }
  .stack { max-width:720px; display:flex; flex-direction:column; gap:var(--space-4); }
  .frame { position:relative; background:var(--scene-bg); border:1px solid var(--border-strong); border-radius:var(--radius-lg); overflow:hidden; aspect-ratio:720/380; }
  .frame svg.scene { display:block; width:100%; height:100%; }
  .overlay { position:absolute; display:flex; align-items:center; gap:var(--space-2); }
  .tl { top:var(--space-3); left:var(--space-3); }
  .tr { top:var(--space-3); right:var(--space-3); }
  .bl { bottom:var(--space-3); left:var(--space-3); }
  .br { bottom:var(--space-3); right:var(--space-3); }
  .panel { background:var(--surface-200); border:1px solid var(--border-strong); border-radius:var(--radius-md); box-shadow:var(--shadow-sm); }
  /* segmented */
  .seg { display:inline-flex; padding:2px; gap:2px; background:var(--surface-sunken); }
  .seg label { position:relative; }
  .seg input { position:absolute; opacity:0; inset:0; margin:0; cursor:pointer; }
  .seg span { display:inline-flex; align-items:center; min-height:32px; padding:0 var(--space-3); border-radius:var(--radius-sm); color:var(--ink); border:1px solid transparent; }
  .seg input:checked + span { background:var(--accent-soft); border-color:var(--border-strong); font-weight:600; }
  .seg input:focus-visible + span { outline:2px solid var(--ring); outline-offset:2px; }
  /* tools */
  .tools { display:inline-flex; padding:2px; gap:2px; }
  .tool { display:inline-grid; place-items:center; width:32px; height:32px; padding:0; border-radius:var(--radius-sm); border:1px solid transparent; background:transparent; color:var(--ink); cursor:pointer; }
  .tool:hover, .tool.is-hover { background:var(--surface-300); border-color:var(--border-strong); }
  .tool[aria-pressed="true"] { background:var(--accent-soft); border-color:var(--border-strong); color:var(--accent-strong); }
  .tool:disabled { opacity:.45; cursor:not-allowed; }
  .tool:focus-visible { outline:2px solid var(--ring); outline-offset:2px; }
  .chip { display:inline-flex; align-items:baseline; gap:var(--space-2); padding:var(--space-1) var(--space-3); min-height:32px; box-sizing:border-box; align-items:center; }
  .chip .label { color:var(--ink-muted); text-transform:uppercase; }
  .legend { display:grid; grid-template-columns:auto auto; gap:var(--space-1) var(--space-4); padding:var(--space-2) var(--space-3); margin:0; list-style:none; }
  .legend li { display:flex; align-items:center; gap:var(--space-2); color:var(--ink); }
  .sw { width:14px; height:14px; border-radius:var(--radius-sm); border:1px solid var(--border-strong); flex:none; }
  .sw-board { background:var(--scene-board); } .sw-copper { background:var(--scene-copper); }
  .sw-done { background:var(--scene-done); } .sw-laser { background:var(--scene-laser); }
  /* scene */
  .floor { fill:var(--scene-floor); stroke:var(--border-strong); stroke-width:1; stroke-linejoin:round; }
  .hole { fill:var(--scene-peg); }
  .board { fill:var(--scene-board); stroke:var(--border-strong); stroke-width:1.5; stroke-linejoin:round; vector-effect:non-scaling-stroke; }
  .copper { fill:none; stroke:var(--scene-copper); stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
  .pad { fill:var(--scene-copper); }
  .engraved { fill:none; stroke:var(--scene-done); stroke-width:3.6; stroke-linecap:round; stroke-linejoin:round; }
  .ahead { fill:none; stroke:var(--scene-laser); stroke-width:2; stroke-dasharray:5 4; stroke-linecap:round; stroke-linejoin:round; }
  .peg rect, .peg ellipse { fill:var(--scene-peg); }
  .peg .top { stroke:var(--scene-bg); stroke-width:1.5; }
  .lbl { fill:var(--ink); font:500 12px var(--font-sans); paint-order:stroke; stroke:var(--scene-floor); stroke-width:4px; stroke-linejoin:round; }
  svg [hidden] { display:none; }
  .beam { stroke:var(--scene-laser); stroke-width:2; }
  .spot { fill:var(--scene-laser); stroke:var(--scene-bg); stroke-width:1.5; }
  .head { fill:var(--scene-laser); stroke:var(--border-strong); stroke-width:1.5; stroke-linejoin:round; }
  .note { color:var(--ink-muted); margin:0; }
  .states { display:flex; flex-wrap:wrap; gap:var(--space-6); align-items:center; }
  .states figure { margin:0; display:flex; flex-direction:column; gap:var(--space-1); align-items:flex-start; }
  .states figcaption { color:var(--ink-muted); }
</style>
</head>
