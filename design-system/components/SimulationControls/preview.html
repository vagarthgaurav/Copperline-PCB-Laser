<!-- @dsCard group="Viewport" height=420 subtitle="Transport, speed, scrubber and time readout for the dry-run simulation" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SimulationControls</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  body { margin:0; padding:var(--space-4); background:var(--surface-100); color:var(--ink); font-family:var(--font-sans); }
  .stack { display:flex; flex-direction:column; gap:var(--space-3); max-width:720px; }
  .cap { color:var(--ink-muted); margin:0; }
  .bar { background:var(--surface-200); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); padding:var(--space-3) var(--space-4); display:flex; flex-direction:column; gap:var(--space-3); }
  .row { display:flex; flex-wrap:wrap; align-items:center; gap:var(--space-4); }
  .transport { display:flex; gap:var(--space-2); align-items:center; }
  .btn { display:inline-grid; place-items:center; min-width:36px; height:36px; padding:0; border-radius:var(--radius-md); border:1px solid var(--border-strong); background:var(--surface-300); color:var(--ink); cursor:pointer; }
  .btn:hover { background:var(--accent-soft); }
  .btn.primary { width:44px; height:44px; background:var(--accent); border-color:var(--accent); color:var(--on-accent); border-radius:var(--radius-pill); }
  .btn.primary:hover { background:var(--accent-strong); border-color:var(--accent-strong); }
  .btn:disabled { opacity:.45; cursor:not-allowed; background:var(--surface-300); }
  .btn:focus-visible, .seg input:focus-visible + span, .scrub input:focus-visible { outline:2px solid var(--ring); outline-offset:2px; }
  .seg { display:inline-flex; gap:2px; padding:2px; background:var(--surface-sunken); border:1px solid var(--border-strong); border-radius:var(--radius-md); }
  .seg label { position:relative; }
  .seg input { position:absolute; inset:0; margin:0; opacity:0; cursor:pointer; }
  .seg span { display:inline-flex; align-items:center; justify-content:center; min-width:44px; min-height:30px; border-radius:var(--radius-sm); border:1px solid transparent; color:var(--ink); }
  .seg label:hover span { background:var(--surface-300); }
  .seg input:checked + span { background:var(--accent-soft); border-color:var(--border-strong); }
  .time { margin-left:auto; display:flex; align-items:baseline; white-space:nowrap; }
  .time .tot { color:var(--ink-muted); margin-left:var(--space-2); }
  .scrub { position:relative; height:32px; }
  .scrub .track { position:absolute; left:0; right:0; top:11px; height:8px; background:var(--surface-sunken); border:1px solid var(--border-strong); border-radius:var(--radius-pill); box-sizing:content-box; margin-top:-1px; overflow:hidden; }
  .scrub .fill { position:absolute; left:0; top:0; bottom:0; width:calc(10px + (100% - 20px) * var(--p)); background:var(--accent); border-radius:var(--radius-pill); }
  .scrub input { position:absolute; inset:0; width:100%; height:32px; margin:0; background:transparent; -webkit-appearance:none; appearance:none; cursor:pointer; }
  .scrub input::-webkit-slider-runnable-track { height:32px; background:transparent; }
  .scrub input::-moz-range-track { height:32px; background:transparent; }
  .scrub input::-webkit-slider-thumb { -webkit-appearance:none; appearance:none; width:20px; height:28px; margin-top:2px; border-radius:var(--radius-pill); background:var(--surface-300); border:2px solid var(--border-strong); box-shadow:var(--shadow-sm); box-sizing:border-box; }
  .scrub input::-moz-range-thumb { width:20px; height:28px; border-radius:var(--radius-pill); background:var(--surface-300); border:2px solid var(--border-strong); box-shadow:var(--shadow-sm); box-sizing:border-box; }
  .scrub input:hover::-webkit-slider-thumb { border-color:var(--accent-strong); }
  .scrub input:hover::-moz-range-thumb { border-color:var(--accent-strong); }
  .note { margin:0; display:flex; align-items:center; gap:var(--space-2); color:var(--ink-muted); }
  .ic-w { display:inline-flex; }
</style>
</head>

<script>
  const PLAY = '<svg class="ic" width="20" height="20" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false"><path d="M240,128a15.74,15.74,0,0,1-7.6,13.51L88.32,229.65a16,16,0,0,1-16.2.3A15.86,15.86,0,0,1,64,216.13V39.87a15.86,15.86,0,0,1,8.12-13.82,16,16,0,0,1,16.2.3L232.4,114.49A15.74,15.74,0,0,1,240,128Z"/></svg>';
  const PAUSE = '<svg class="ic" width="20" height="20" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false"><path d="M216,48V208a16,16,0,0,1-16,16H160a16,16,0,0,1-16-16V48a16,16,0,0,1,16-16h40A16,16,0,0,1,216,48ZM96,32H56A16,16,0,0,0,40,48V208a16,16,0,0,0,16,16H96a16,16,0,0,0,16-16V48A16,16,0,0,0,96,32Z"/></svg>';
  const mm = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  document.querySelectorAll('.bar').forEach(bar => {
    const btn = bar.querySelector('.play');
    btn.addEventListener('click', () => {
      const playing = btn.dataset.playing !== 'true';
      btn.dataset.playing = String(playing);
      btn.setAttribute('aria-pressed', String(playing));
      btn.setAttribute('aria-label', playing ? 'Pause' : 'Play');
      btn.innerHTML = playing ? PAUSE : PLAY;
    });
    const range = bar.querySelector('input[type=range]');
    const sync = () => {
      const p = range.value / range.max;
      range.style.setProperty('--p', p);
      bar.querySelector('.fill').style.setProperty('--p', p);
      bar.querySelector('.el').textContent = mm(Number(range.value));
    };
    range.addEventListener('input', sync);
  });
</script>
