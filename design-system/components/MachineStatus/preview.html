<!-- @dsCard group="Feedback" height=600 subtitle="Serial connection, live position, job progress, controls and console" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MachineStatus</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  body { margin:0; padding:var(--space-4); background:var(--surface-100); color:var(--ink); font-family:var(--font-sans); }
  .stack { display:flex; flex-direction:column; gap:var(--space-4); max-width:600px; }
  .card { background:var(--surface-200); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); padding:var(--space-4); display:flex; flex-direction:column; gap:var(--space-3); }
  .head { display:flex; flex-wrap:wrap; align-items:center; gap:var(--space-2); }
  .field { display:flex; flex-direction:column; gap:2px; }
  .field .label { color:var(--ink-muted); }
  select { height:36px; padding:0 var(--space-3); border-radius:var(--radius-md); border:1px solid var(--border-strong); background:var(--surface-300); color:var(--ink); font:400 13px/20px var(--font-mono); }
  .btn { display:inline-flex; align-items:center; gap:var(--space-1); min-height:36px; padding:0 var(--space-3); border-radius:var(--radius-md); border:1px solid var(--border-strong); background:var(--surface-300); color:var(--ink); cursor:pointer; }
  .btn:hover { background:var(--accent-soft); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
  .btn.primary:hover { background:var(--accent-strong); border-color:var(--accent-strong); }
  .btn.danger { background:transparent; border-color:var(--danger); color:var(--danger); }
  .btn.danger:hover { background:var(--danger-soft); }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  .btn:disabled:hover { background:var(--surface-300); }
  .btn.primary:disabled:hover { background:var(--accent); }
  .btn:focus-visible, select:focus-visible { outline:2px solid var(--ring); outline-offset:2px; }
  .chip { display:inline-flex; align-items:center; gap:var(--space-1); min-height:32px; padding:0 var(--space-3) 0 var(--space-2); border-radius:var(--radius-pill); box-sizing:border-box; margin-left:auto; }
  .chip.ok { background:var(--mask-soft); color:var(--mask); border:1px solid var(--mask); }
  .chip.off { background:var(--surface-sunken); color:var(--ink-muted); border:1px solid var(--border-strong); }
  .pos { display:grid; grid-template-columns:repeat(3, 1fr); gap:var(--space-3); }
  .pos > div { background:var(--surface-300); border:1px solid var(--border); border-radius:var(--radius-md); padding:var(--space-2) var(--space-3); }
  .pos .label { color:var(--ink-muted); }
  .pos .v { display:flex; align-items:baseline; gap:var(--space-1); }
  .pos .readout.na { color:var(--ink-muted); }
  .job .title { display:flex; justify-content:space-between; gap:var(--space-3); flex-wrap:wrap; }
  .progress { height:8px; margin:var(--space-2) 0; background:var(--surface-sunken); border:1px solid var(--border-strong); border-radius:var(--radius-pill); overflow:hidden; box-sizing:content-box; }
  .progress > div { height:100%; width:32%; background:var(--accent); }
  .meta { color:var(--ink-muted); margin:0; }
  .actions { display:flex; flex-wrap:wrap; gap:var(--space-2); }
  .console { margin:0; padding:var(--space-2) var(--space-3); background:var(--surface-sunken); border:1px solid var(--border); border-radius:var(--radius-md); list-style:none; color:var(--ink); }
  .console .ok { color:var(--mask); } .console .st { color:var(--ink-muted); }
  .note { margin:0; color:var(--ink-muted); }
</style>
</head>
<body class="body">

    </div>
